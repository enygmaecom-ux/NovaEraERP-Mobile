name: Build NovaEraERP Mobile APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NovaEraERP_Mobile_V7.2.3.12.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaEraERP-Mobile-APK
          path: NovaEraERP_Mobile_V7.2.3.12.apk
